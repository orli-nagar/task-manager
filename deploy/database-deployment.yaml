apiVersion: apps/v1
kind: Deployment

metadata:
  name: db

spec:
  replicas: 1

  selector:
    matchLabels:
      app: db

  template:
    metadata:
      labels:
        app: db

    spec:
      containers:
        - name: postgres
          image: quay.io/sclorg/postgresql-15-c9s:latest

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRESQL_USER
              value: taskmanager

            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: task-manager-secret
                  key: postgres-password

            - name: POSTGRESQL_DATABASE
              value: taskmanager
